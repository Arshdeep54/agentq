[package]
name = "agentq"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "An embeddable job queue with idempotency keys, per-lane backpressure and bounded concurrency, for agent tool calls."
repository = "https://github.com/Arshdeep54/agentq"
documentation = "https://docs.rs/agentq"
readme = "README.md"
keywords = ["queue", "async", "tokio", "idempotency", "backpressure"]
categories = ["asynchronous", "concurrency"]
exclude = [
  "docs/**/*.mdx",
  "docs/docs.json",
  "docs/favicon.svg",
  "docs/logo/**",
  ".github/**",
]

[features]
sqlite = ["dep:rusqlite"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "time"] }
rusqlite = { version = "0.40.2", optional = true, features = ["bundled"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
